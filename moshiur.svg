<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#17242d" stroke-width="1"/>
  </pattern>
  <filter id="glowBlue"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowGreen"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowPurple"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:"SFMono-Regular","Cascadia Code","Roboto Mono","Courier New",monospace}
    .title{font-size:25px;font-weight:700;letter-spacing:2px;fill:#edf2f7}
    .sub{font-size:12px;fill:#91a4b7;letter-spacing:.4px}
    .name{font-size:15px;font-weight:700;fill:#edf2f7}
    .label{font-size:10px;fill:#8295a8;letter-spacing:.5px}
    .value{font-size:23px;font-weight:700;fill:#dbe5ee}
  </style>
</defs>

<!-- Background -->
<rect width="1000" height="220" fill="#0b1117"/>
<rect width="1000" height="220" fill="url(#grid)" opacity=".65"/>

<!-- Main container -->
<rect x="18" y="12" width="964" height="196" rx="18" fill="#0f171e" stroke="#2b3d4c" stroke-width="1.5"/>

<!-- Header -->
<rect x="38" y="30" width="34" height="34" rx="9" fill="#101d22" stroke="#28e5b2" stroke-width="1.5"/>
<path d="M48 42l7 5-7 5M58 52h7" fill="none" stroke="#28e5b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)"/>
<text x="84" y="53" class="mono title">GITHUB STATISTICS</text>
<text x="84" y="73" class="mono sub">A quick look at my GitHub activity</text>

<!-- Card 1 -->
<rect x="38" y="91" width="298" height="94" rx="13" fill="#0c141b" stroke="#269ee8" stroke-width="1.2"/>
<rect x="54" y="108" width="48" height="48" rx="11" fill="#101c25" stroke="#269ee8" stroke-width="1.2"/>
<path d="M65 121h13l4 4h10v20H65z M65 121v-3h11l3 3" fill="none" stroke="#269ee8" stroke-width="2" stroke-linejoin="round" filter="url(#glowBlue)"/>
<circle cx="317" cy="110" r="4" fill="#269ee8" filter="url(#glowBlue)"/>
<text x="116" y="126" class="mono name">Repositories</text>
<text x="116" y="143" class="mono label">TOTAL PUBLIC REPOSITORIES</text>
<text x="55" y="175" class="mono value">--</text>
<path d="M307 173h14m-5-5 5 5-5 5" fill="none" stroke="#269ee8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Card 2 -->
<rect x="351" y="91" width="298" height="94" rx="13" fill="#0c141b" stroke="#22d7b2" stroke-width="1.2"/>
<rect x="367" y="108" width="48" height="48" rx="11" fill="#101d20" stroke="#22d7b2" stroke-width="1.2"/>
<path d="M380 133l-6 6 6 6M402 133l6 6-6 6M397 128l-12 22" fill="none" stroke="#22d7b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)"/>
<circle cx="630" cy="110" r="4" fill="#22d7b2" filter="url(#glowGreen)"/>
<text x="429" y="126" class="mono name">Commits</text>
<text x="429" y="143" class="mono label">TOTAL COMMITS</text>
<text x="368" y="175" class="mono value">--</text>
<path d="M620 173h14m-5-5 5 5-5 5" fill="none" stroke="#22d7b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Card 3 -->
<rect x="664" y="91" width="298" height="94" rx="13" fill="#0c141b" stroke="#8950e8" stroke-width="1.2"/>
<rect x="680" y="108" width="48" height="48" rx="11" fill="#151023" stroke="#8950e8" stroke-width="1.2"/>
<path d="M691 145v-8h6v8h-6zM702 145v-17h6v17h-6zM713 145v-25h6v25h-6z" fill="none" stroke="#8950e8" stroke-width="2" stroke-linejoin="round" filter="url(#glowPurple)"/>
<circle cx="945" cy="110" r="4" fill="#8950e8" filter="url(#glowPurple)"/>
<text x="742" y="126" class="mono name">Contributions</text>
<text x="742" y="143" class="mono label">TOTAL CONTRIBUTIONS</text>
<text x="681" y="175" class="mono value">--</text>
<path d="M935 173h14m-5-5 5 5-5 5" fill="none" stroke="#8950e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>